<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur {{.Code}}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="{{.Theme}}">
<a href="/toggle-theme" class="theme-toggle-btn">
    {{if eq .Theme "dark-theme"}}☀️{{else}}🌙{{end}}
</a>

<div class="container">
    <div class="error-page">
        <div class="error-content">
            <div class="error-code">{{.Code}}</div>
            <h1 class="error-title">{{.Message}}</h1>
            <p class="error-details">{{.Details}}</p>
            
            <div class="error-actions">
                <a href="/" class="error-btn primary">🏠 Retour à laccueil</a>
                <a href="/artists" class="error-btn secondary">👥 Voir les artiste</a>
            </div>
        </div>
    </div>
</div>

<style>
.error-page {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70vh;
    padding: 40px 20px;
}

.error-content {
    text-align: center;
    max-width: 600px;
}

.error-code {
    font-size: 8em;
    font-weight: 900;
    color: var(--accent-color);
    line-height: 1;
    margin-bottom: 20px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
}

.error-title {
    font-size: 2.5em;
    margin-bottom: 15px;
    color: var(--text-primary);
}

.error-details {
    font-size: 1.2em;
    color: var(--text-secondary);
    margin-bottom: 40px;
    line-height: 1.6;
}

.error-actions {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
}

.error-btn {
    padding: 15px 30px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: bold;
    font-size: 1.1em;
    transition: all 0.3s ease;
    display: inline-block;
}

.error-btn.primary {
    background: var(--accent-color);
    color: white;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.error-btn.primary:hover {
    background: var(--accent-hover);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}

.error-btn.secondary {
    background: var(--bg-secondary);
    color: var(--text-primary);
    border: 2px solid var(--accent-color);
}

.error-btn.secondary:hover {
    background: var(--accent-color);
    color: white;
    transform: translateY(-2px);
}

@media (max-width: 768px) {
    .error-code {
        font-size: 5em;
    }
    
    .error-title {
        font-size: 1.8em;
    }
    
    .error-actions {
        flex-direction: column;
    }
    
    .error-btn {
        width: 100%;
    }
}
</style>
</body>
</html>
