<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Artistes</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="{{.Theme}}">
<a href="/toggle-theme" class="theme-toggle-btn">
    {{if eq .Theme "dark-theme"}}☀️{{else}}🌙{{end}}
</a>

<div class="container">
    <nav class="navbar">
        <div class="nav-links">
            <a href="/"><strong>Groupie Tracker</strong></a>
            <a href="/artists">Artistes</a>
        </div>

        <form action="/search" method="GET" class="search-form">
            <input type="text" name="query" placeholder="Rechercher..." class="search-input" required>
            <button type="submit" class="search-button">Go</button>
        </form>
    </nav>

    <h1 style="margin-bottom: 20px; font-size: 2.5em;">Nos Artistes</h1>

    {{if .Data}}
    <div class="artists-grid">
        {{range .Data}}
        <div class="artist-card">
            <img src="{{.Image}}" alt="{{.Name}}" class="artist-image">
            <div class="artist-info">
                <div class="artist-name">{{.Name}}</div>
                <div class="artist-details">
                    <p>Depuis : {{.CreationDate}}</p>
                    <p>{{len .Members}} membre(s)</p>
                </div>
                <a href="/artist/{{.ID}}" class="view-details-btn">Voir détails</a>
            </div>
        </div>
        {{end}}
    </div>
    {{else}}
    <div style="text-align:center; padding: 50px;">
        <p>Chargement des artistes...</p>
    </div>
    {{end}}
</div>
</body>
</html>
